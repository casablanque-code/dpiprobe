[package]
name = "dpiprobe"
version = "0.1.0"
authors = ["root"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
clap = { version = "4.6.7", features = ["derive"] }
hkdf = "0.12"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["full"] }
